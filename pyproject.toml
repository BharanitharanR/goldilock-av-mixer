[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goldilock-av-mixer"
version = "0.1.0"
description = "LLM-planned deterministic audio/video mixing skill"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "google-genai>=1.0", "numpy>=1.24"]

[project.scripts]
goldilock-av-mixer = "video_audio_mixer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
